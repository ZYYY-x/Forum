server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: forum-content-service
  data:
    redis:
      host: "${FORUM_REDIS_HOST:localhost}"
      port: ${FORUM_REDIS_PORT:6379}
      password: "${FORUM_REDIS_PASSWORD:}"
      database: ${FORUM_REDIS_DB:0}
      timeout: 2s
  rabbitmq:
    addresses: "${FORUM_RABBIT_ADDR:localhost}"
    username: "${FORUM_RABBIT_USERNAME:admin}"
    password: "${FORUM_RABBIT_PASSWORD:}"
    virtual-host: /
    trusted-packages: "com.example"
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_ADDR:127.0.0.1:8848}"
        enabled: ${NACOS_ENABLED:true}
        register-enabled: ${NACOS_ENABLED:true}
        namespace: "${NACOS_NAMESPACE:}"
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  security:
    jwt:
      key: "${FORUM_JWT_SECRET:dev-only-change-me-32-bytes-minimum}"
      expire: ${FORUM_JWT_EXPIRE_DAYS:7}
  datasource:
    username: "${FORUM_CONTENT_DB_USERNAME:root}"
    password: "${FORUM_CONTENT_DB_PASSWORD:}"
    url: "${FORUM_CONTENT_DB_URL:jdbc:mysql://localhost:3306/forum_content?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${FORUM_DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000

forum:
  services:
    user:
      url: "${FORUM_USER_SERVICE_URL:}"
  internal:
    token: "${FORUM_INTERNAL_TOKEN:dev-internal-token}"

management:
  server:
    port: ${MANAGEMENT_PORT:9083}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
    web:
      server:
        max-uri-tags: 50
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
    prometheus:
      enabled: true
