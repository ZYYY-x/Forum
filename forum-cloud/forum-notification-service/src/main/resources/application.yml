server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: forum-notification-service
  data:
    redis:
      host: "${FORUM_REDIS_HOST:localhost}"
      port: ${FORUM_REDIS_PORT:6379}
      password: "${FORUM_REDIS_PASSWORD:}"
      database: ${FORUM_REDIS_DB:0}
      timeout: 2s
  cloud:
    nacos:
      discovery:
        server-addr: "${NACOS_ADDR:127.0.0.1:8848}"
        enabled: ${NACOS_ENABLED:true}
        register-enabled: ${NACOS_ENABLED:true}
        namespace: "${NACOS_NAMESPACE:}"
  security:
    jwt:
      key: "${FORUM_JWT_SECRET:dev-only-change-me-32-bytes-minimum}"
      expire: ${FORUM_JWT_EXPIRE_DAYS:7}
  rabbitmq:
    addresses: "${FORUM_RABBIT_ADDR:localhost}"
    username: "${FORUM_RABBIT_USERNAME:admin}"
    password: "${FORUM_RABBIT_PASSWORD:}"
    virtual-host: /
    trusted-packages: "com.example"
  mail:
    host: "${FORUM_MAIL_HOST:smtp.163.com}"
    port: ${FORUM_MAIL_PORT:465}
    username: "${FORUM_MAIL_USERNAME:}"
    password: "${FORUM_MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true
            trust: "${FORUM_MAIL_SSL_TRUST:smtp.163.com}"
  datasource:
    username: "${FORUM_NOTIFICATION_DB_USERNAME:postgres}"
    password: "${FORUM_NOTIFICATION_DB_PASSWORD:}"
    url: "${FORUM_NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=forum_notification&sslmode=prefer}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${FORUM_DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000

management:
  server:
    port: ${MANAGEMENT_PORT:9084}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
    web:
      server:
        max-uri-tags: 50
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
    prometheus:
      enabled: true
